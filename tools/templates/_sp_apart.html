<div class="sp-tabs" data-tabs>
  <div class="sp-tablist" role="tablist" aria-label="What sets us apart">
    {% for a in SC.APART %}<button type="button" role="tab" id="tab-{{ a.slug }}" aria-controls="panel-{{ a.slug }}" aria-selected="{{ 'true' if loop.first else 'false' }}"{% if not loop.first %} tabindex="-1"{% endif %}>{{ a.name }}</button>{% endfor %}
  </div>
  {% for a in SC.APART %}
  <div class="sp-panel" role="tabpanel" id="panel-{{ a.slug }}" aria-labelledby="tab-{{ a.slug }}"{% if not loop.first %} hidden{% endif %}>
    <h3>{{ a.name }}</h3>
    {% for p in a.paras %}<p>{{ p }}</p>{% endfor %}
    {% if a.slug == 'benefits' %}
    <ul class="sp-benefits">{% for k, t in SC.BENEFITS %}<li><strong>{{ k }}</strong><span>{{ t }}</span></li>{% endfor %}</ul>
    {% endif %}
  </div>
  {% endfor %}
</div>
